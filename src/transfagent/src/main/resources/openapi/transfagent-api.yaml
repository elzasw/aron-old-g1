openapi: 3.0.2
info:
  title: Transfagent Service API
  version: 1.0.0
tags:
  - name: Transfagent
paths:
  /apus:
    get:
      tags:
        - Transfagent
      operationId: getApus
      description: Returns list of apus
      parameters:
        - name: datadir
          in: query
          required: false
          description: directory of apu
          schema:
            type: string
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApuSourceResponse'
  /apus/{apuId}/reimport:
    patch:
      tags:
        - Transfagent
      operationId: reimportApu
      description: Mark apu for reimport in database
      parameters:
        - $ref: '#/components/parameters/apuId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApuSourceDef'
  /archives:
    get:
      tags:
        - Transfagent
      operationId: getArchives
      description: Returns list of archives
      parameters:
        - name: name
          in: query
          required: false
          description: name of archive
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: string
  /daos:
    get:
      tags:
        - Transfagent
      operationId: getDaos
      description: Return list of daos filtered by required criteria
      parameters:
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaosResponse'
  /daos/reimport:
    post:
      tags:
        - Transfagent
      operationId: reimportDaos
      description: Mark daos for reimport in database
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
  /daos/{daoId}/reimport:
    patch:
      tags:
        - Transfagent
      operationId: reimportDao
      description: Mark dao for reimport in database
      parameters:
        - $ref: '#/components/parameters/daoId'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaoDef'
  /entities:
    get:
      tags:
        - Transfagent
      operationId: getEntities
      description: Return list of entities filtered by required criteria
      parameters:
        - name: code
          in: query
          required: false
          description: code of entity
          schema:
            type: string
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitiesResponse'
  /findingaids:
    get:
      tags:
        - Transfagent
      operationId: getFindingAids
      description: Return list of finding aids filtered by required criteria
      parameters:
        - name: code
          in: query
          required: false
          description: code of finding aids
          schema:
            type: string
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingAidsResponse'
  /funds:
    get:
      tags:
        - Transfagent
      operationId: getFunds
      description: Return list of funds filtered by required criteria
      parameters:
        - name: code
          in: query
          required: false
          description: code of fund
          schema:
            type: string
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundsResponse'
components:
  parameters:
    apuId:
      name: apuId
      in: path
      required: true
      description: id of apu
      schema:
        type: integer
        format: int64
    daoId:
      name: daoId
      in: path
      required: true
      description: id of dao
      schema:
        type: integer
        format: int64
    page:
      name: page
      in: query
      required: false
      description: číslo stránky
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    pageSize:
      name: pageSize
      in: query
      required: false
      description: velikost stránky
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 200
    uuidOptional:
      name: uuid
      in: query
      required: false
      description: uuid volitelný
      schema:
        type: string
  schemas:
    ApuSourceDef:
      type: object
      required:
        - sourceType
      properties:
        apusourceId:
          type: integer
          format: int64
        sourceType:
          $ref: '#/components/schemas/ApuSourceType'
        uuid:
          type: string
        dataDir:
          type: string
        deleted:
          type: boolean
        reimport:
          type: boolean
        imported:
          type: string
          format: date-time
      description: Apu source definition
    ApuSourceResponse:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApuSourceDef'
        totalCount:
          type: integer
          format: int32
      description: Returned list of ApuSources
    ApuSourceType:
      type: string
      enum:
        - DIRECT
        - FUND
        - FINDING_AID
        - ARCH_DESCS
        - COLLECTION
        - INSTITUTION
        - ARCH_ENTITY
      description: Types of apu source
    DaoDef:
      type: object
      properties:
        daoId:
          type: integer
          format: int64
        uuid:
          type: string
        handle:
          type: string
        apusourceId:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/DaoStateDef'
        transferred:
          type: boolean
        dataDir:
          type: string
        source:
          type: string
      description: Dao definition
    DaoStateDef:
      type: string
      enum:
        - READY
        - ACCESSIBLE
        - INACCESSIBLE
      description: Dao states
    DaosResponse:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DaoDef'
        totalCount:
          type: integer
          format: int32
      description: Returned list of daos
    EntitiesResponse:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityDef'
        totalCount:
          type: integer
          format: int32
      description: Returned list of entities
    EntityDef:
      type: object
      properties:
        entityId:
          type: integer
          format: int64
        uuid:
          type: string
        elzaId:
          type: string
        parentId:
          type: integer
          format: int64
        apusourceId:
          type: integer
          format: int64
        entityClass:
          type: string
        state:
          $ref: '#/components/schemas/EntityStateDef'
      description: Entity definition
    EntityStateDef:
      type: string
      enum:
        - ACCESSIBLE
        - AVAILABLE
        - NOT_ACCESSIBLE
        - NOT_AVAILABLE
      description: Entity states
    FindingAidDef:
      type: object
      properties:
        findingAidId:
          type: integer
          format: int64
        uuid:
          type: string
        code:
          type: string
        apusourceId:
          type: integer
          format: int64
        institutionId:
          type: integer
          format: int64
      description: Fnding aid definition
    FindingAidsResponse:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindingAidDef'
        totalCount:
          type: integer
          format: int32
      description: Returned list of finding aids
    FundDef:
      type: object
      properties:
        fundId:
          type: integer
          format: int64
        uuid:
          type: string
        code:
          type: string
        source:
          type: string
        apusourceId:
          type: integer
          format: int64
        institutionId:
          type: integer
          format: int64
      description: Fund definition
    FundsResponse:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FundDef'
        totalCount:
          type: integer
          format: int32
      description: Returned list of funds
servers:
  - url: https://localhost:3000/
    description: Devel server
    variables: {}
