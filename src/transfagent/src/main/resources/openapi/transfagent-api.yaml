openapi: 3.0.2
info:
  version: 1.0.0
  title: Transfagent Service API
servers:
  - url: 'https://localhost:3000/'
tags:
  - name: Transfagent

paths:
  '/archives':
    get:
      tags:
        - Transfagent
      summary: Returns list of archives
      description: ''
      operationId: getArchives
      parameters:
        - in: query
          name: name
          description: Name of archive
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                
  '/apus':
    get:
      tags:
        - Transfagent
      summary: Returns list of apus
      description: List of apus
      operationId: getApus
      parameters:
        - in: query
          name: datadir
          description: directory of apu
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApuSourceResponse'


components:

  schemas:
  
    ApuSourceType:
      type: string
      enum: &APU_TYPE
        - DIRECT
        - FUND
        - FINDING_AID
        - ARCH_DESCS
        - COLLECTION
        - INSTITUTION
        - ARCH_ENTITY
      
    ApuSourceDef:
      description: pocet SIPu rizeni archiv, puvodce
      type: object
      properties:
        apusourceId:
          type: integer
          format: int64
        sourceType:
          $ref: '#/components/schemas/ApuSourceType'          
        uuid:
          type: string 
        dataDir:
          type: string
        deleted:
          type: boolean
        reimport:
          type: boolean
        imported:
          type: string
          format: date-time

    ApuSourceResponse:
      description: Vraceny seznam priloh
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApuSourceDef'
        totalCount:
          type: integer
          format: int32
      required: [items, totalCount]
    
  parameters:                      
                                   
    uuidOptional:                  
      in: query                    
      name: uuid                   
      required: false              
      schema:                      
        type: string               
                                   
    page:                          
      in: query                    
      name: page                   
      description: Cislo stranky   
      required: false              
      schema:                      
        type: integer              
        format: int32              
        default: 0                 
        minimum: 0                 
                                   
    pageSize:                      
      in: query                    
      name: pageSize               
      description: Velikost stranky
      required: false              
      schema:                      
        type: integer              
        format: int32              
        default: 200               
        minimum: 1                 
        maximum: 1000              
