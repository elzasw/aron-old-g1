openapi: 3.0.2
info:
  version: 1.0.0
  title: Transfagent Service API
servers:
  - url: 'https://localhost:3000/'
tags:
  - name: Transfagent

paths:
  '/archives':
    get:
      tags:
        - Transfagent
      summary: Returns list of archives
      description: ''
      operationId: getArchives
      parameters:
        - in: query
          name: name
          description: Name of archive
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                
  '/apus':
    get:
      tags:
        - Transfagent
      summary: Returns list of apus
      description: List of apus
      operationId: getApus
      parameters:
        - in: query
          name: datadir
          description: directory of apu
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApuSourceResponse'

  '/apus/{apuId}/reimport':
    patch:
      tags:
        - Transfagent      
      summary: Mark apu for reimport
      description: Mark apu fo reimport in database      
      operationId: reimportApu
      parameters:
        - $ref: '#/components/parameters/apuId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApuSourceDef'
                
                
  '/daos':
    get:
      tags:
        - Transfagent
      summary: Return list of daos
      description: Return list of daos filtered by required criteria
      operationId: getDaos
      parameters:
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'      
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaosResponse'

  '/daos/{daoId}/reimport':
    patch:
      tags:
        - Transfagent      
      summary: Mark dao for reimport
      description: Mark apu fo reimport in database      
      operationId: reimportDao
      parameters:
        - $ref: '#/components/parameters/daoId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaoDef'

  '/daos/reimport':
    post:
      tags:
        - Transfagent      
      summary: Mark dao for reimport
      description: Mark apu fo reimport in database      
      operationId: reimportDaos
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Success
                
  '/funds':
    get:
      tags:
        - Transfagent
      summary: Return list of funds
      description: Return list of daos filtered by required criteria
      operationId: getFunds
      parameters:
        - in: query
          name: code
          description: fund code
          required: false
          schema:
            type: string      
        - $ref: '#/components/parameters/uuidOptional'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'      
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundsResponse'


components:

  schemas:
  
    ApuSourceType:
      type: string
      enum: &APU_TYPE
        - DIRECT
        - FUND
        - FINDING_AID
        - ARCH_DESCS
        - COLLECTION
        - INSTITUTION
        - ARCH_ENTITY
      
    ApuSourceDef:
      description: ApuSource
      type: object
      properties:
        apusourceId:
          type: integer
          format: int64
        sourceType:
          $ref: '#/components/schemas/ApuSourceType'          
        uuid:
          type: string 
        dataDir:
          type: string
        deleted:
          type: boolean
        reimport:
          type: boolean
        imported:
          type: string
          format: date-time

    ApuSourceResponse:
      description: Returned list of ApuSources
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApuSourceDef'
        totalCount:
          type: integer
          format: int32
      required: [items, totalCount]
      
    DaoStateDef:
      type: string
      enum: &DAO_STATE
        - READY
        - ACCESSIBLE
        - INACCESSIBLE
      
    DaoDef:
      description: Dao
      type: object
      properties:
        daoId:
          type: integer
          format: int64
        uuid:
          type: string 
        handle:
          type: string
        apusourceId:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/DaoStateDef'
        transferred:
          type: boolean
        dataDir:
          type: string
        source:
          type: string

    DaosResponse:
      description: Returned list of Daos
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DaoDef'
        totalCount:
          type: integer
          format: int32
      required: [items, totalCount]
    
    FundDef:
      description: Dao
      type: object
      properties:
        fundId:
          type: integer
          format: int64
        uuid:
          type: string
        code:
          type: string 
        source:
          type: string
        apusourceId:
          type: integer
          format: int64
        institutionId:
          type: integer
          format: int64
    
    FundsResponse:
      description: Returned list of funds
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FundDef'
        totalCount:
          type: integer
          format: int32
      required: [items, totalCount]
    
  parameters:
  
    apuId:
      in: path
      name: apuId
      description: id apu
      required: true
      schema:
        type: integer
        format: int64

    daoId:
      in: path
      name: daoId
      description: id of dao
      required: true
      schema:
        type: integer
        format: int64

    uuidOptional:                  
      in: query                    
      name: uuid                   
      required: false              
      schema:                      
        type: string               
                                   
    page:                          
      in: query                    
      name: page                   
      description: Cislo stranky   
      required: false              
      schema:                      
        type: integer              
        format: int32              
        default: 0                 
        minimum: 0                 
                                   
    pageSize:                      
      in: query                    
      name: pageSize               
      description: Velikost stranky
      required: false              
      schema:                      
        type: integer              
        format: int32              
        default: 200               
        minimum: 1                 
        maximum: 1000              
