    post:
      operationId: FundPublication_createFundPublication
      description: |-
        Enqueue a new publication for the current open version of the fund.

        Rejected with 409 if the current fund version already has a
        publication of the same type in NEW state (avoids racing two
        identical async generations). A previous publication in PREPARED
        or later state does NOT block: the fund may have changed and
        the new publication carries different content.
        Rejected with 403 if the target publication type is inactive.
      parameters:
        - $ref: '#/components/parameters/FundIdParameter'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDetail'
        '403':
          description: Publication type is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '404':
          description: Publication type or fund not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - publication-internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublication'
