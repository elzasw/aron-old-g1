openapi: 3.0.2
info:
  title: ELZA API
  version: 1.0.0
tags:
  - name: accesspoint-internal
    description: Access-point API used by the Elza UI
  - name: publication-internal
    description: Publication API used by the Elza UI
  - name: publication
    description: Public API for the publication system
  - name: tasks
    description: Úkoly
  - name: search
    description: Vyhledávání
  - name: structure
    description: structure
  - name: node
    description: Práce s úrovněmi a uzly
  - name: report
    description: Statistické zprávy
  - name: aips
    description: aips
  - name: io
    description: Vstup a výstup informací
  - name: accesspoints
    description: Přístupové body a archivní entity
  - name: descitems
    description: Záznamy v archivních fondech
  - name: funds
    description: Archivní soubory
  - name: externalsystems
    description: Externí systémy
  - name: daos
    description: Digitální archivní objekty
  - name: admin
    description: Administrativní funkce
  - name: rules
    description: Pravidla popisu archiválií (typy atributů, datové typy, …)
servers:
  - url: http://localhost
    description: Výchozí server
  - url: http://localhost:8080
    description: Devel server
paths:
  /accesspoint:
    delete:
      operationId: AccessPoint_deleteAccessPoints
      description: Invalidation of access points
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccessPointsDetail'
        description: seznam ID nebo UUID, které chceme smazat
  /accesspoint/search:
    post:
      operationId: AccessPoint_search
      description: |-
        Search for access points.
        Accepts the same filter inputs as /accesspoint/export (scalar fields + ApAdvanceSearchFilter)
        plus pagination (from, count) and the criteria-query SearchType selectors.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApAccessPointSearchResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPointSearchParams'
        description: filter selecting the access points to search for
  /accesspoint/export:
    post:
      operationId: AccessPoint_batchExport
      description: |-
        Asynchronously export access points matching the given search query to CSV.
        Returns the request id; poll /io/export-status/{id} and download the result via /io/file/{id}.
        Results are ordered by accessPointId ascending. The filter shape mirrors the scalar
        parameters of /registry/search, so the same registry-list filter values can be passed
        through. Empty body / null fields means "all access points visible to the user".
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPointBatchExportParams'
        description: filter selecting the access points to export
  /accesspoint/export/{queueItemId}:
    put:
      operationId: AccessPoint_exportForceOrNo
      description: Decision on forced export ELZA -> CAM
      parameters:
        - name: queueItemId
          in: path
          required: true
          description: id of queue
          schema:
            type: integer
        - name: force
          in: query
          required: true
          description: 'force export: yes or no'
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/invalidated:
    get:
      operationId: AccessPoint_getInvalidatedEntities
      description: Get invalidated (deleted) entities
      parameters:
        - name: page
          in: query
          required: false
          description: number of the page
          schema:
            type: integer
            default: 0
          explode: false
        - name: pageSize
          in: query
          required: false
          description: page size
          schema:
            type: integer
            default: 10
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidatedEntities'
      tags:
        - accesspoints
  /accesspoint/{id}:
    delete:
      operationId: AccessPoint_deleteAccessPoint
      description: Invalidation of access point (delete/replace)
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccessPointDetail'
        description: addition for method of invalidation
  /accesspoint/{id}/autoitems:
    get:
      operationId: AccessPoint_getAutoitems
      description: List of automatically generated elements of the description
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAutoItems'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/copy:
    put:
      operationId: AccessPoint_copyAccessPoint
      description: Copying an archive entity
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityRef'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyAccessPointDetail'
        description: additional copy options
  /accesspoint/{id}/lastParticipants:
    get:
      operationId: AccessPoint_getLastParticipants
      description: Get a list of entity processors
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
      tags:
        - accesspoints
  /accesspoint/{id}/part:
    post:
      operationId: AccessPoint_createPart
      description: Create new part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: accesspoint version
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPart'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApPartFormVO'
        description: data for creating a part
  /accesspoint/{id}/part/{partId}:
    post:
      operationId: AccessPoint_updatePart
      description: Update a part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: id of part
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: accesspoint version
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApPartFormVO'
        description: data for updating a part
    delete:
      operationId: AccessPoint_deletePart
      description: Delete part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of ApAccessPoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/part/{partId}/prefer-name:
    put:
      operationId: AccessPoint_setPreferName
      description: Set the preferred name of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of ApAccessPoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
