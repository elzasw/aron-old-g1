        extRevision:
          type: string
        extPrevRevision:
          type: string
        extMetadataRevision:
          type: string
        extCreatedAt:
          type: string
          format: date-time
          description: time of revision creation in the external system
        createChangeAt:
          type: string
          format: date-time
          description: fallback timestamp from arr_change when extCreatedAt is missing
        sender:
          type: string
          description: sender of the revision — value of ApBindingState.extUser
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ExtParticipant'
      description: |-
        One revision in the binding's history, assembled from ap_binding_state with
        embedded participants from ap_binding_participant. Participants are returned
        ordered by lastChange (ascending).
