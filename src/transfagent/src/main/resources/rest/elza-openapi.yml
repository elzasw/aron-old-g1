  /accesspoint/{id}/validate:
    get:
      operationId: AccessPoint_validateAccessPoint
      description: Validation of an archive entity
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: includeRevision
          in: query
          required: false
          description: include revision
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApValidationIssues'
        '404':
