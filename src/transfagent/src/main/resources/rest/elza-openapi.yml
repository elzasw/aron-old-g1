  /accesspoint/{id}/revision/part/{revPartId}:
    post:
      operationId: AccessPoint_updateRevisionPart
      description: Update a revision part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: revPartId
          in: path
          required: true
