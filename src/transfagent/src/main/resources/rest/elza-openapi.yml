          DATE: '#/components/schemas/DataDate'
          DECIMAL: '#/components/schemas/DataDecimal'
          FILE_REF: '#/components/schemas/DataFileRef'
          INT: '#/components/schemas/DataInteger'
          JSON_TABLE: '#/components/schemas/DataJsonTable'
          ENUM: '#/components/schemas/DataEnum'
          RECORD_REF: '#/components/schemas/DataRecordRef'
          STRING: '#/components/schemas/DataString'
          STRUCTURED: '#/components/schemas/DataStructureRef'
          TEXT: '#/components/schemas/DataText'
          FORMATTED_TEXT: '#/components/schemas/DataFormattedText'
          UNITDATE: '#/components/schemas/DataUnitdate'
          UNITID: '#/components/schemas/DataUnitid'
          URI_REF: '#/components/schemas/DataUriRef'
      description: Item data parent
    ItemDataResult:
      type: object
      properties:
        parent:
          allOf:
            - $ref: '#/components/schemas/NodeBase'
          description: parent node
        item:
          allOf:
            - $ref: '#/components/schemas/NodeItem'
          description: item
      description: Výsledek vytvoření nebo aktualizace ArrDescItem
    ItemDisplayType:
      type: string
      enum:
        - NUMBER
        - DURATION
      description: Display hint for items of `dataType == INT`.
    ItemTableColumn:
      type: object
      required:
        - code
        - name
        - dataType
      properties:
        code:
          type: string
          description: Column code.
        name:
          type: string
          description: Human-readable column name (localized).
        dataType:
          type: string
          description: Column data type — limited subset; see ELZA package XSD.
        width:
          type: integer
          description: Suggested column width.
      description: Column definition for items of `dataType == JSON_TABLE`.
    ItemType:
      type: object
      required:
        - id
        - code
        - name
        - shortcut
        - dataType
        - sortable
      properties:
        id:
          type: integer
          description: Database identifier of the underlying `rul_item_type` row. Not stable across deployments — use `code` for cross-system references.
        code:
          type: string
          description: Stable public code (e.g. "ZP2015_UNIT_ID").
        name:
          type: string
          description: Human-readable name (localized).
        shortcut:
          type: string
          description: Short label for compact UI such as column headers (localized).
        description:
          type: string
          description: Longer description (localized).
        dataType:
          allOf:
            - $ref: '#/components/schemas/DataType'
          description: Underlying value type.
        sortable:
          type: boolean
          description: Whether items of this type can be used as a sort key.
        structureTypeCode:
          type: string
          description: |-
            For `dataType == STRUCTURED` only: code of the structure type whose
            template defines this item's nested fields.
        viewDefinition:
          allOf:
            - $ref: '#/components/schemas/ItemViewDefinition'
          description: Optional rendering hints; variant determined by `dataType`.
        specs:
          type: array
          items:
            $ref: '#/components/schemas/ItemTypeSpec'
          description: Available specifications, in display order. Empty/omitted ⇒ no specifications.
      description: |-
        Definition of one item type registered in the rules.

        Replaces the legacy `RulDescItemTypeExtVO` exposed via
        `GET /api/rule/descItemTypes`. Display order is given by the order of
        the response `itemTypes[]` array.

        Per-form behaviour (whether the item is required/recommended, whether it
        is repeatable in a given context, etc.) is **not** part of this registry
        — that information lives in `FormItemType` / `FormItemSpec`, returned by
        the node-form endpoints.
    ItemTypeGroup:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/FormItemType'
      description: |-
        Skupina zapouzdrující typy hodnot atributů pro UI

        Náhrada `ItemTypeGroupVO`
    ItemTypeList:
      type: object
      required:
        - itemTypes
      properties:
        itemTypes:
          type: array
          items:
            $ref: '#/components/schemas/ItemType'
          description: Item types defined across all loaded rule sets, in display order.
      description: Response payload for `GET /itemTypes`.
    ItemTypeSpec:
      type: object
      required:
        - id
        - code
        - name
        - shortcut
      properties:
        id:
          type: integer
          description: Database identifier of the underlying `rul_item_spec` row. Not stable across deployments — use `code` for cross-system references.
        code:
          type: string
          description: Stable public code.
        name:
          type: string
          description: Human-readable name (localized).
        shortcut:
          type: string
          description: Short label for compact UI (localized).
        description:
          type: string
          description: Longer description (localized).
      description: |-
        A specification (enumerated value) of an item type.
        Display order is given by the order of the parent `specs[]` array.
    ItemViewDefinition:
      type: object
      required:
        - dataType
      properties:
        dataType:
          $ref: '#/components/schemas/DataType'
      discriminator:
        propertyName: dataType
        mapping:
          INT: '#/components/schemas/IntViewDefinition'
          STRING: '#/components/schemas/StringViewDefinition'
          JSON_TABLE: '#/components/schemas/JsonTableViewDefinition'
      description: |-
        Optional rendering hints for an `ItemType`.

        Discriminated by `dataType`. Item types whose data type has no rendering
        hint (DATE, COORDINATES, RECORD_REF, …) simply omit `viewDefinition` on
        `ItemType`.
