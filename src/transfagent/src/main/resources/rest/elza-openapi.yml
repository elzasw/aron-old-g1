components:
  parameters:
    FsRepoIdParameter:
      name: fsrepoId
      in: path
      required: true
      description: FileSystem repository ID
      schema:
        type: integer
    FundIdParameter:
      name: fundId
      in: path
      required: true
      description: Fund ID
      schema:
        type: integer
    FundVersionIdParameter:
      name: fundVersionId
      in: path
      required: true
      description: Fund ID Version
      schema:
        type: integer
    NodeIdParameter:
      name: nodeId
      in: path
      required: true
      description: Node ID
      schema:
        type: integer
  schemas:
    AbstractField:
      type: object
      required:
        - fieldType
      properties:
        fieldType:
          $ref: '#/components/schemas/FieldType'
      discriminator:
        propertyName: fieldType
        mapping:
          FONDS_FIELD: '#/components/schemas/FondsField'
          NODE_FIELD: '#/components/schemas/NodeField'
          DESC_ITEM: '#/components/schemas/DescItemField'
      description: Used as a parent for filter fields
    AbstractFilter:
      type: object
      required:
        - filterType
      properties:
        filterType:
          $ref: '#/components/schemas/FilterType'
      discriminator:
        propertyName: filterType
        mapping:
          fieldValue: '#/components/schemas/FieldValueFilter'
          contains: '#/components/schemas/MultimatchContainsFilter'
          logical: '#/components/schemas/LogicalFilter'
      description: Used as a parent for all other filters
    Admin.CopyPermissionParams:
      type: object
      required:
        - fromUserId
      properties:
        fromUserId:
          type: integer
    AdminInfo:
      type: object
      required:
        - funds
        - levels
        - accessPoints
        - users
        - loggedUsers
      properties:
        funds:
          type: integer
          format: int32
          description: Number of funds
        levels:
          type: integer
          format: int32
          description: Number of valid levels
        accessPoints:
          type: integer
          format: int32
          description: Number of valid access points
        users:
          type: integer
          format: int32
          description: Number of users
        loggedUsers:
          type: integer
          format: int32
          description: Number of logged users
      description: Basic statistics about Elza instance
    ApPartFormVO:
      type: object
      format: partform
      description: Data for create/update a part (external)
    ApStateApproval:
      type: string
      enum:
        - NEW
        - TO_APPROVE
        - APPROVED
        - TO_AMEND
      description: States of ApState
    ApStateUpdate:
      type: object
      required:
        - stateApproval
      properties:
        typeId:
          type: integer
          description: id of type
        scopeId:
          type: integer
          description: id of scope
        comment:
          type: string
          description: comment
        stateApproval:
          allOf:
            - $ref: '#/components/schemas/ApStateApproval'
          description: state of ApState
      description: Data for changing state of ApAccessPoint
    ApValidationIssues:
      type: object
      required:
        - errors
        - partErrors
      properties:
        errors:
          type: array
          items:
            type: string
        partErrors:
          type: array
          items:
            $ref: '#/components/schemas/PartValidationIssues'
      description: Entity validation issues/errors
    AutoValue:
      type: object
      properties:
        itemTypeId:
          type: integer
          description: identifier of the type of the description element
        itemSpecId:
          type: integer
          description: identifier of the specification of the description element
        value:
          type: string
          description: value of the element
      description: Automatically generated elements of the description
    BaseException:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          type: string
        message:
          type: string
        level:
          type: string
        properties:
          type: object
        stackTrace:
          type: string
      description: Error specification for the client
    CopyAccessPointDetail:
      type: object
      required:
        - scope
      properties:
        scope:
          type: string
          description: code of scope or id
        replace:
          type: boolean
          description: if the original AP should be replaced
        skipItems:
          type: array
          items:
            type: integer
          description: list of description element IDs not to copy
      description: Additional copy options
    CreateFund:
      type: object
      required:
        - name
        - ruleSetCode
        - institutionIdentifier
        - scopes
      properties:
        name:
          type: string
          description: Název
        ruleSetCode:
          type: string
          description: Kód pravidel
        institutionIdentifier:
          type: string
          description: Identifikátor instituce (podpora pro kód instituce i UUID přístupového bodu)
        internalCode:
          type: string
          description: Interní kód
        uuid:
          type: string
          description: UUID - identifikátor AS (pokud není vyplněno, bude vygenerováno)
        fundNumber:
          type: integer
          description: Číslo archivního souboru
        unitdate:
          type: string
          description: Datace
        mark:
          type: string
          description: Značka archivního souboru
        adminUsers:
          type: array
          items:
            type: integer
          description: Seznam uživatelů, kteří mají administrátorská oprávnění pro zakládaný AS
        adminGroups:
          type: array
          items:
            type: integer
          description: Seznam skupin, kteří mají administrátorská oprávnění pro zakládaný AS
        scopes:
          type: array
          items:
            type: string
          minItems: 1
          description: Seznam oblastí entit
      description: Zakládaný archivní souboru
    CreatedPart:
      type: object
      required:
        - partId
        - apVersion
      properties:
        partId:
          type: integer
        apVersion:
          type: integer
      description: Result of creating a part
    DataBit:
      type: object
      required:
        - bitValue
      properties:
        bitValue:
          type: boolean
      allOf:
        - $ref: '#/components/schemas/ItemData'
      description: ItemData classes extensions
    DataCoordinates:
      type: object
      required:
        - value
      properties:
        value:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataDate:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          format: date
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataDecimal:
      type: object
      required:
        - value
      properties:
        value:
          type: number
          format: decimal
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataEnum:
      type: object
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataFileRef:
      type: object
      required:
        - fileId
      properties:
        fileId:
          type: integer
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataFormattedText:
      type: object
      required:
        - value
      properties:
        value:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataInteger:
      type: object
      required:
        - integerValue
      properties:
        integerValue:
          type: integer
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataJsonTable:
      type: object
      required:
        - value
      properties:
        value:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataRecordRef:
      type: object
      required:
        - value
      properties:
        value:
          type: integer
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataString:
      type: object
      required:
        - stringValue
      properties:
        stringValue:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataStructureRef:
      type: object
      required:
        - structuredObjectId
      properties:
        structuredObjectId:
          type: integer
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataText:
      type: object
      required:
        - textValue
      properties:
        textValue:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataType:
      type: string
      enum:
        - INT
        - STRING
        - TEXT
        - UNITDATE
        - UNITID
        - FORMATTED_TEXT
        - COORDINATES
        - RECORD_REF
        - DECIMAL
        - STRUCTURED
        - ENUM
        - FILE_REF
        - JSON_TABLE
        - DATE
        - URI_REF
        - BIT
      description: Data types for ItemData classes
    DataUnitdate:
      type: object
      required:
        - value
      properties:
        value:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataUnitid:
      type: object
      required:
        - unitId
      properties:
        unitId:
          type: string
      allOf:
