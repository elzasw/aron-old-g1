components:
  parameters:
    AipIdParameter:
      name: aipId
      in: path
      required: true
      description: Aip ID
      schema:
        type: integer
    FsRepoIdParameter:
      name: fsrepoId
      in: path
      required: true
      description: FileSystem repository ID
      schema:
        type: integer
    FundIdParameter:
      name: fundId
      in: path
      required: true
      description: Fund ID
      schema:
        type: integer
    FundVersionIdParameter:
      name: fundVersionId
      in: path
      required: true
      description: Fund ID Version
      schema:
        type: integer
    NodeIdParameter:
      name: nodeId
      in: path
      required: true
      description: Node ID
      schema:
        type: integer
    PublicationIdParameter:
      name: publicationId
      in: path
      required: true
      description: Publication ID (ARR_EXPORT.export_id).
      schema:
        type: integer
  schemas:
    AbstractField:
      type: object
      required:
        - fieldType
      properties:
        fieldType:
          $ref: '#/components/schemas/FieldType'
      discriminator:
        propertyName: fieldType
        mapping:
          FONDS_FIELD: '#/components/schemas/FondsField'
          NODE_FIELD: '#/components/schemas/NodeField'
          DESC_ITEM: '#/components/schemas/DescItemField'
      description: Used as a parent for filter fields
    AbstractFilter:
      type: object
      required:
        - filterType
      properties:
        filterType:
          $ref: '#/components/schemas/FilterType'
      discriminator:
        propertyName: filterType
        mapping:
          fieldValue: '#/components/schemas/FieldValueFilter'
          contains: '#/components/schemas/MultimatchContainsFilter'
          logical: '#/components/schemas/LogicalFilter'
      description: Used as a parent for all other filters
    Admin.CopyPermissionParams:
      type: object
      required:
        - fromUserId
      properties:
        fromUserId:
          type: integer
    AdminInfo:
      type: object
      required:
        - funds
        - levels
        - accessPoints
        - users
        - loggedUsers
      properties:
        funds:
          type: integer
          format: int32
          description: Number of funds
        levels:
          type: integer
          format: int32
          description: Number of valid levels
        accessPoints:
          type: integer
          format: int32
          description: Number of valid access points
        users:
          type: integer
          format: int32
          description: Number of users
        loggedUsers:
          type: integer
          format: int32
          description: Number of logged users
      description: Basic statistics about Elza instance
    AipDetailFilteredResult:
      type: object
      required:
        - count
        - rows
      properties:
        count:
          type: integer
          description: Počet výsledků
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AipDetailVO'
          description: Seznam objektů
    AipDetailVO:
      type: object
      required:
        - aipId
        - code
        - digitalRepositoryId
        - aipVersion
        - fund
        - fundCode
        - institution
        - originatorInstitution
        - originator
        - unitdateFrom
        - unitdateTo
        - institutionCode
        - ingestionCode
        - referenceNumber
        - nadChangeCode
        - aipSize
        - metadataLoad
        - completeAipLoad
        - metadataError
        - metadataErrorException
        - aipVersionMetadata
        - importState
        - exportState
        - linkedNodes
      properties:
        aipId:
          type: integer
          description: Id AIPu
        code:
          type: string
          description: Kód AIPu
        digitalRepositoryId:
          type: integer
          description: Id digitálního repozitáře
        aipVersion:
          type: string
          description: Verze AIPu
        fund:
          allOf:
            - $ref: '#/components/schemas/ArrFundGen'
          description: Archivní soubor
        fundCode:
          type: string
          description: Kód archivního souboru
        institution:
          allOf:
            - $ref: '#/components/schemas/ParInstitutionGen'
          description: Instituce
        originatorInstitution:
          allOf:
            - $ref: '#/components/schemas/ParInstitutionGen'
          description: Instituce původce
        originator:
          type: string
          description: Původce
        unitdateFrom:
          type: string
          description: Datace od
        unitdateTo:
          type: string
          description: Datace do
        institutionCode:
          type: string
          description: Kód instituce
        ingestionCode:
          type: string
          description: Číslo příjemky
        referenceNumber:
          type: string
          description: Číslo jednací příjemky ve spisovce
        nadChangeCode:
          type: string
          description: Identifikátor vnější změny NAD v PEvA
        aipSize:
          type: integer
          description: Velikost AIPu v bytech
        metadataLoad:
          type: boolean
          description: Příznak načtených metadat
        completeAipLoad:
          type: boolean
          description: Příznak načteného kompletního AIPu
        metadataError:
